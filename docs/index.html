<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berlin · free &amp; almost-free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* One typeface, one accent. Colour is reserved for a single job: the small
     dot that says which kind of event a card is. Everything else is paper,
     ink and one hairline, so the page reads instead of shouting. */
  :root{
    --bg:#FAF8F5; --surface:#FFFFFF; --ink:#2B2B2E; --head:#1A1A1D;
    --muted:#73707A; --line:#E7E3DC; --accent:#5A5FA8; --accent-soft:#ECEDF7;
    --shadow:0 1px 2px rgba(30,25,40,.05);
    --font:'Nunito',system-ui,-apple-system,sans-serif;
    --controls-h:0px;
  }
  /* kind colours are set inline per dot (see KINDS in the script) */

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  a:hover{color:var(--accent)}

  .mast{padding:26px clamp(16px,3vw,32px) 14px;max-width:1500px;margin:0 auto}
  .mast h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--head)}
  .mast .sub{margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}

  /* ---- controls: tabs decide WHEN, chips decide WHAT. Nothing else. ---- */
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);
            border-bottom:1px solid var(--line);padding:0 clamp(16px,3vw,32px) 12px}
  .cwrap{max-width:1500px;margin:0 auto}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;padding-top:4px;align-items:center}
  .tab{border:0;background:none;font:inherit;font-weight:700;font-size:14px;
       color:var(--muted);padding:9px 14px;border-radius:9px;cursor:pointer;
       display:flex;align-items:center;gap:7px}
  .tab:hover{background:var(--accent-soft);color:var(--head)}
  .tab[aria-selected="true"]{background:var(--head);color:#fff}
  .tab .n{font-size:12px;font-weight:700;opacity:.65}
  .tab[aria-selected="true"] .n{opacity:.8}

  .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:var(--surface);font:inherit;
        font-weight:600;font-size:12.5px;color:var(--muted);border-radius:999px;
        padding:4px 10px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--accent);color:var(--head)}
  .chip[aria-pressed="true"]{border-color:var(--head);background:var(--head);color:#fff}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#999);flex:none}
  .tabs .search{margin-left:auto;flex:0 1 300px}
  .search{flex:1;min-width:170px;font:inherit;font-weight:600;font-size:14px;
          border:1px solid var(--line);background:var(--surface);border-radius:9px;
          padding:8px 13px;color:var(--ink)}
  .search::placeholder{color:var(--muted);font-weight:500}
  .search:focus{outline:none;border-color:var(--accent)}

  /* ---- feed ---- */
  main{padding:4px clamp(16px,3vw,32px) 56px;max-width:1500px;margin:0 auto}
  .lead{font-size:13.5px;color:var(--muted);font-weight:600;margin:16px 2px 2px}
  .daybar{display:flex;align-items:baseline;gap:10px;margin:22px 2px 10px;
          padding-bottom:7px;border-bottom:1px solid var(--line)}
  .daybar .d1{font-size:16px;font-weight:800;color:var(--head)}
  .daybar .d2{font-size:13px;color:var(--muted);font-weight:600}
  .daybar .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
  .ev{background:var(--surface);border:1px solid var(--line);border-radius:11px;
      box-shadow:var(--shadow);padding:12px 14px 11px;display:flex;flex-direction:column;
      gap:8px;height:100%}
  .ev:hover{border-color:#D6D1C8}
  .ev .title{font-size:15px;font-weight:700;color:var(--head);line-height:1.32}
  .ev .title a{text-decoration:none}
  /* one plain line on what actually happens — the answer to "what is this?" */
  .ev .summary{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4;margin-top:-3px}
  .rows dd.who{color:#9A5B12;font-weight:700}
  .ev .summary.nodesc{font-style:italic;font-weight:500;opacity:.75}
  /* every value carries its label, so no string is a mystery */
  .rows{display:grid;grid-template-columns:46px 1fr;gap:3px 10px;align-items:baseline;margin:0}
  .rows dt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
           color:var(--muted);opacity:.75}
  .rows dd{margin:0;font-size:13px;color:var(--ink);font-weight:600;line-height:1.4}
  .rows dd.soft{color:var(--muted);font-weight:500}
  .rows dd.free{color:#2E7A52;font-weight:700}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
       background:var(--c,#999);margin-right:6px;vertical-align:baseline}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
        margin-top:auto;padding-top:7px;border-top:1px solid var(--line)}
  .src{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .cal{border:1px solid var(--line);background:none;font:inherit;font-size:11px;
       font-weight:700;color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer;flex:none}
  .cal:hover{border-color:var(--accent);color:var(--accent)}

  .more{margin:10px 0 2px;border:1px dashed var(--line);background:none;font:inherit;
        font-weight:700;font-size:13px;color:var(--muted);border-radius:9px;
        padding:9px 14px;cursor:pointer;width:100%}
  .more:hover{border-color:var(--accent);color:var(--accent)}

  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;
         background:#F0EEE9;color:var(--muted)}
  .badge.open{background:#E3F2E9;color:#2E7A52}
  .badge.closed{background:#F3E7E7;color:#9A5151}
  .place{background:var(--surface);border:1px solid var(--line);border-radius:11px;
         padding:11px 14px;display:flex;flex-direction:column;gap:5px}
  .place .pr{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .place .nm{font-size:15px;font-weight:700;color:var(--head);text-decoration:none}
  .place .sub{font-size:12.5px;color:var(--muted);font-weight:500}

  /* My week: her own list, day by day, with what is actually on */
  .mday{margin:20px 2px 4px;padding-bottom:6px;border-bottom:1px solid var(--line);
        display:flex;gap:10px;align-items:baseline}
  .mday .d1{font-size:16px;font-weight:800;color:var(--head)}
  .mday .d2{font-size:13px;color:var(--muted);font-weight:600}
  .mitem{display:grid;grid-template-columns:170px 1fr;gap:4px 16px;padding:8px 2px;
         border-bottom:1px dashed var(--line)}
  .mitem .lab{font-weight:800;color:var(--head);font-size:14px}
  .mitem .lab a{text-decoration:none}
  .mitem .lab .nt{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
  .mev{font-size:13.5px;line-height:1.45;padding:1px 0}
  .mev .t{font-weight:700;color:var(--head);display:inline-block;min-width:44px}
  .mev a{text-decoration:none;font-weight:700;color:var(--head)}
  .mev a:hover{color:var(--accent)}
  .mev .v{color:var(--muted);font-weight:600}
  .mev.none{color:var(--muted);font-style:italic}
  .mgrp{margin-top:6px}
  .mlinks{display:flex;flex-wrap:wrap;gap:6px 8px;margin:6px 0 4px}
  .mlink{border:1px solid var(--line);background:var(--surface);border-radius:9px;
         padding:5px 10px;font-size:13px;font-weight:700;color:var(--head);text-decoration:none}
  .mlink .c{color:#2E7A52;font-weight:700;margin-left:4px}
  .mlink.plain{color:var(--muted);font-weight:600;border-style:dashed}
  .star{font-size:11px;font-weight:800;color:#9A6510;white-space:nowrap}
  @media (max-width:620px){.mitem{grid-template-columns:1fr}}
  /* the hidden-events switch: says what is hidden and how many, one click to show */
  .hidebar{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600}
  .hidebar button{border:0;background:none;font:inherit;font-weight:700;color:var(--accent);
                  cursor:pointer;padding:0 0 0 4px;text-decoration:underline}
  .mgroup{margin:22px 2px 6px;font-size:14px;font-weight:800;color:var(--head)}
  .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px}
  .mrow{font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line);
        display:flex;justify-content:space-between;gap:10px}
  .mrow a{font-weight:700;text-decoration:none;color:var(--head)}
  .mrow .why{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
  .state{font-size:14px;color:var(--muted);padding:44px 4px;max-width:52ch;font-weight:600}
  .state b{display:block;color:var(--head);font-size:16px;margin-bottom:6px}
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .controls{position:static}
  }
</style>
</head>
<body>

<header class="mast">
  <h1>Berlin · free &amp; almost-free</h1>
  <div class="sub"><span id="count">…</span> · <span id="updated"></span></div>
</header>

<section class="controls" id="controls">
  <div class="cwrap">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="mine"    aria-selected="true">My week <span class="n" id="nMine"></span></button>
      <button class="tab" role="tab" data-tab="today"   aria-selected="false">Today <span class="n" id="nToday"></span></button>
      <button class="tab" role="tab" data-tab="week"    aria-selected="false">This week <span class="n" id="nWeek"></span></button>
      <button class="tab" role="tab" data-tab="regular" aria-selected="false">Every week <span class="n" id="nReg"></span></button>
      <button class="tab" role="tab" data-tab="free"    aria-selected="false">Always free <span class="n" id="nFree"></span></button>
      <button class="tab" role="tab" data-tab="manual"  aria-selected="false">Manual check <span class="n" id="nManual"></span></button>
      <input class="search" id="search" type="search" placeholder="Search…" aria-label="Search">
    </div>
    <div class="row2">
      <div class="chips" id="cats"></div>
    </div>
    <div class="hidebar" id="hidebar"></div>
  </div>
</section>

<main id="feed"><div class="state">Loading…</div></main>

<script>
/* What each event IS, in words a reader would use. The dot colour is the only
   colour on a card, and it always means one of these. */
const KINDS=[
  ["exhibition","Exhibitions","#B2537F"], ["music","Music","#C2663F"],
  ["talk","Talks & readings","#4A76A8"],  ["film","Film","#5A5FA8"],
  ["theatre","Theatre & comedy","#8E5BA8"],["workshop","Workshops","#3C8360"],
  ["tour","Guided tours","#7A8B3C"],      ["party","Parties","#7B5EA7"],
  ["market","Markets & fairs","#A5781F"], ["festival","Festivals","#C24F5B"],
  ["sport","Sport & outdoors","#2F8A87"], ["meetup","Meetups","#4E8BC4"],
  ["support","Advice & support","#78757F"],["misc","Unsorted","#A09CA8"]];
const KIND=Object.fromEntries(KINDS.map(([id,label,c])=>[id,{label,c}]));
const kindOf=ev=>KIND[ev.kind]?ev.kind:"misc";
const WHO={kids:"Kids & families",seniors:"Older people",group:"A specific group",
           women:"Women only",men:"Men only"};

/* Hidden by default (your choice): kids, older people, single-group events,
   advice & support. One click shows them; nothing is deleted. */
const HIDE_AUD=new Set(["kids","seniors","group"]);
const HIDE_KIND=new Set(["support"]);
const isHidden=ev=>HIDE_AUD.has(ev.audience)||HIDE_KIND.has(ev.kind);

const DOW3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const _DOWMAP={su:0,mo:1,tu:2,we:3,th:4,fr:5,sa:6};
const PER_DAY=8;

const state={tab:"mine",kinds:new Set(),q:"",expanded:new Set(),showHidden:false};
let DATA={events:[],always_free:[],manual_check:[]};
let MY=null;            // docs/my_list.json — her own list

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bDate=iso=>new Date(iso).toLocaleDateString("en-CA",{timeZone:"Europe/Berlin"});
const bTime=iso=>new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"});
const bDateL=iso=>new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"Europe/Berlin"});
const todayISO=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Europe/Berlin"});

function matches(ev,includeHidden){
  if(!includeHidden&&isHidden(ev))return false;
  if(state.kinds.size&&!state.kinds.has(kindOf(ev)))return false;
  if(state.q){
    const hay=[ev.title,ev.title_orig,ev.summary,ev.venue,ev.area,ev.source].filter(Boolean).join(" ").toLowerCase();
    if(!hay.includes(state.q))return false;
  }
  return true;
}
function recurDows(ev){
  const s=ev.recurrence||"";
  const found=DOW3.map((d,i)=>s.includes(d)?i:-1).filter(i=>i>=0);
  return found.length?found:[new Date(ev.start).getDay()];
}

/* ---------------- card ---------------- */
function card(ev,opts){
  opts=opts||{};
  const allDay=(ev.date_source||"").endsWith("allday");
  const at=opts.when||ev.start;
  const to=(!allDay&&!opts.when&&ev.end)?` – ${bTime(ev.end)}`:"";
  const when=allDay?"All day (no set time)":`${bTime(at)}${to}`;
  const whereTxt=[ev.venue,ev.area].filter(Boolean).map(esc).join(" · ");
  const where=whereTxt?`<dd>${whereTxt}</dd>`:`<dd class="soft">Not listed — see link</dd>`;
  const cost=ev.is_free===true?`<dd class="free">Free</dd>`
            :(ev.price?`<dd>${esc(ev.price)}</dd>`:`<dd class="soft">Check on the site</dd>`);
  const cad=ev.recurrence||"Regularly";
  const repeats=(ev.recurring&&!(opts.inDayGroup&&/^Every week\b/.test(cad)))
    ?`<dt>Repeats</dt><dd>${esc(cad)}</dd>`:"";
  const who=(ev.audience&&ev.audience!=="everyone"&&WHO[ev.audience])
    ?`<dt>Who</dt><dd class="who">${WHO[ev.audience]}</dd>`:"";
  const k=KIND[kindOf(ev)];
  const tip=ev.title_orig?` title="Original: ${esc(ev.title_orig)}"`:"";
  const title=ev.url?`<a href="${esc(ev.url)}" target="_blank" rel="noopener"${tip}>${esc(ev.title)}</a>`
                    :`<span${tip}>${esc(ev.title)}</span>`;
  return `<article class="ev">
    <div class="title">${title}</div>
    ${ev.summary?`<div class="summary">${esc(ev.summary)}</div>`
                :`<div class="summary nodesc">No description available — open the link</div>`}
    <dl class="rows">
      <dt>When</dt><dd>${when}</dd>
      ${repeats}
      <dt>Where</dt>${where}
      <dt>Cost</dt>${cost}
      ${who}
      <dt>Type</dt><dd><span class="dot" style="--c:${k.c}"></span>${esc(k.label)}</dd>
    </dl>
    <div class="foot">
      <span class="src">${onList(ev)?'<span class="star">★ On your list</span> · ':""}${esc((ev.source||"").replace(/^cal:|^rss:|^web:|^gib:/,""))}</span>
      <button class="cal" type="button" data-ics="${esc(ev.id||"")}">+ Calendar</button>
    </div>
  </article>`;
}
const grid=html=>`<div class="grid">${html}</div>`;
function dayBlock(key,label,sub,list,inDayGroup){
  const open=state.expanded.has(key);
  const shown=open?list:list.slice(0,PER_DAY);
  let h=`<div class="daybar"><span class="d1">${esc(label)}</span>`
      +(sub?`<span class="d2">${esc(sub)}</span>`:"")+`<span class="n">${list.length}</span></div>`;
  h+=grid(shown.map(ev=>card(ev,{inDayGroup})).join(""));
  if(list.length>PER_DAY)
    h+=`<button class="more" data-exp="${esc(key)}">${open?"Show fewer":`Show all ${list.length}`}</button>`;
  return h;
}

/* ---------------- pools (one per tab) ---------------- */
function weekWindow(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+7);b.setHours(23,59,59,999);return[a,b];}
const POOLS={
  today:inc=>{const iso=todayISO(),dow=new Date().getDay();
    return {ones:DATA.events.filter(e=>!e.recurring&&matches(e,inc)&&bDate(e.start)===iso),
            regs:DATA.events.filter(e=>e.recurring&&matches(e,inc)&&recurDows(e).includes(dow))};},
  week:inc=>{const[a,b]=weekWindow();
    return {ones:DATA.events.filter(e=>!e.recurring&&matches(e,inc)&&new Date(e.start)>=a&&new Date(e.start)<=b),regs:[]};},
  regular:inc=>({ones:[],regs:DATA.events.filter(e=>e.recurring&&matches(e,inc))}),
};
const poolSize=(tab,inc)=>{const p=POOLS[tab](inc);return p.ones.length+p.regs.length;};

/* ---------------- her own list (docs/my_list.json) ---------------- */
function compileItem(it){
  const m=it.match||{};
  it._src=(m.sources||[]).map(x=>x.toLowerCase());
  it._tit=(m.titles||[]).map(x=>new RegExp(x,"i"));
  it._ven=(m.venues||[]).map(x=>x.toLowerCase());
  return it;
}
function itemMatches(it,ev){
  if(!it._src)compileItem(it);
  const src=(ev.source||"").toLowerCase();
  if(it._src.some(x=>src.includes(x)))return true;
  const t=`${ev.title||""} ${ev.title_orig||""}`;
  if(it._tit.some(r=>r.test(t)))return true;
  const v=(ev.venue||"").toLowerCase();
  return it._ven.some(x=>v.includes(x));
}
let _listItems=null;
function listItems(){
  if(_listItems)return _listItems;
  _listItems=[];
  if(MY){for(const d of MY.week||[])_listItems.push(...d.items);for(const g of MY.groups||[])_listItems.push(...g.items);}
  _listItems=_listItems.filter(it=>it.match).map(compileItem);
  return _listItems;
}
const onList=ev=>listItems().some(it=>itemMatches(it,ev));
function occursOn(ev,iso,dow){
  return ev.recurring?recurDows(ev).includes(dow):bDate(ev.start)===iso;
}
function berlinDay(offset){
  const d=new Date(Date.now()+offset*864e5);
  const iso=d.toLocaleDateString("en-CA",{timeZone:"Europe/Berlin"});
  const dow=new Date(iso+"T12:00:00").getDay();
  return {iso,dow,label:DOWFULL[dow],short:new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})};
}
function itemLabel(it){
  const name=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.label)}</a>`
           :(it.tab?`<a href="#" data-gotab="${esc(it.tab)}">${esc(it.label)}</a>`:esc(it.label));
  return `<div class="lab">${name}${it.note?`<span class="nt">${esc(it.note)}</span>`:""}</div>`;
}
function evLine(ev,dow){
  const allDay=(ev.date_source||"").endsWith("allday");
  const t=allDay?"all day":bTime(ev.start);
  const title=ev.url?`<a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.title)}</a>`:esc(ev.title);
  const cost=ev.is_free===true?"free":(ev.price||"");
  const bits=[ev.venue,cost].filter(Boolean).map(esc).join(" · ");
  return `<div class="mev"><span class="t">${esc(t)}</span> ${title}${bits?` <span class="v">· ${bits}</span>`:""}</div>`;
}
function mineCount(){
  if(!MY)return 0; let n=0;
  for(let o=0;o<7;o++){const d=berlinDay(o);const w=(MY.week||[]).find(x=>x.day===d.dow);if(!w)continue;
    for(const it of w.items){if(!it.match)continue;
      n+=DATA.events.filter(ev=>!isHidden(ev)&&itemMatches(compileItem(it),ev)&&occursOn(ev,d.iso,d.dow)).length;}}
  return n;
}
function viewMine(){
  if(!MY)return empty("Your list didn't load","docs/my_list.json is missing.");
  let shown=0;
  let h=`<div class="lead">Your own list — the things you know first-hand. Under each one: what is actually on, day by day, for the next 7 days.</div>`;
  for(let o=0;o<7;o++){
    const d=berlinDay(o);
    const w=(MY.week||[]).find(x=>x.day===d.dow);
    if(!w||!w.items.length)continue;
    h+=`<div class="mday"><span class="d1">${o===0?"Today":o===1?"Tomorrow":d.label}</span><span class="d2">${o<2?d.label+", ":""}${d.short}</span></div>`;
    for(const it of w.items){
      let rows="";
      if(it.match){
        const seenT=new Set();
        const evs=DATA.events.filter(ev=>!isHidden(ev)&&itemMatches(compileItem(it),ev)&&occursOn(ev,d.iso,d.dow))
                             .sort((a,b)=>bTime(a.start).localeCompare(bTime(b.start)))
                             .filter(ev=>{const k=(ev.title||"").toLowerCase();if(seenT.has(k))return false;seenT.add(k);return true;});
        shown+=evs.length;
        rows=evs.slice(0,5).map(ev=>evLine(ev,d.dow)).join("");
        if(evs.length>5)rows+=`<div class="mev none">+ ${evs.length-5} more — search “${esc(it.label)}”</div>`;
        if(!evs.length)rows=`<div class="mev none">Nothing found for this day${it.url?" — check their page":""}</div>`;
      }else{
        rows=`<div class="mev none">${it.tab?`Free every day — <a href="#" data-gotab="${esc(it.tab)}">see Always free</a>`
              :it.url?"Not readable automatically — open the link":"No link yet"}</div>`;
      }
      h+=`<div class="mitem">${itemLabel(it)}<div>${rows}</div></div>`;
    }
  }
  // her sources, grouped as she wrote them, with how many upcoming events the site has from each
  h+=`<div class="daybar"><span class="d1">Your sources</span></div>`;
  for(const g of MY.groups||[]){
    h+=`<div class="mgrp"><div class="mgroup">${esc(g.name)}</div><div class="mlinks">`;
    for(const it of g.items){
      const n=it.match?DATA.events.filter(ev=>!isHidden(ev)&&itemMatches(compileItem(it),ev)).length:0;
      const c=n?`<span class="c">${n} on the site</span>`:"";
      h+=it.url?`<a class="mlink" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.note||"")}">${esc(it.label)}${c}</a>`
            :it.tab?`<a class="mlink" href="#" data-gotab="${esc(it.tab)}">${esc(it.label)}${c}</a>`
            :`<span class="mlink${n?"":" plain"}">${esc(it.label)}${c}</span>`;
    }
    h+=`</div></div>`;
  }
  setCount(shown,"from your list this week");
  return h;
}

/* ---------------- views ---------------- */
function viewToday(){
  const {ones,regs}=POOLS.today(state.showHidden), dow=new Date().getDay();
  setCount(ones.length+regs.length,"on today");
  if(!ones.length&&!regs.length)return empty("Nothing today","Nothing matches. Try another type, or look at This week.");
  const byT=(a,b)=>a.start.localeCompare(b.start);
  let h="";
  if(ones.length)h+=dayBlock("t-one","On today","one-off",ones.sort(byT),false);
  if(regs.length)h+=dayBlock("t-reg",`Every ${DOWFULL[dow]}`,"the regulars",regs.sort(byT),true);
  return h;
}
function viewWeek(){
  const {ones}=POOLS.week(state.showHidden);
  setCount(ones.length,"in the next 7 days");
  if(!ones.length)return empty("Nothing this week","No one-off events match.");
  const byDay={};for(const e of ones)(byDay[bDate(e.start)]||=[]).push(e);
  let h=`<div class="lead">One-off events only — the weekly regulars are under <b>Every week</b>.</div>`;
  for(const day of Object.keys(byDay).sort()){
    const list=byDay[day].sort((a,b)=>a.start.localeCompare(b.start));
    h+=dayBlock("w-"+day,DOWFULL[new Date(list[0].start).getDay()],bDateL(list[0].start),list,false);
  }
  return h;
}
function viewRegular(){
  const {regs}=POOLS.regular(state.showHidden);
  setCount(regs.length,"weekly regulars");
  if(!regs.length)return empty("No regulars","Nothing matches.");
  const byDow={};for(const e of regs)for(const d of recurDows(e))(byDow[d]||=[]).push(e);
  let h=`<div class="lead">Things that happen every week — the part you can plan around.</div>`;
  for(let i=1;i<=7;i++){const d=i%7,list=byDow[d];if(!list||!list.length)continue;
    list.sort((a,b)=>bTime(a.start).localeCompare(bTime(b.start)));
    h+=dayBlock("r-"+d,`Every ${DOWFULL[d]}`,"",list,true);}
  return h;
}
function viewFree(){
  const rows=DATA.always_free.filter(p=>!state.q||[p.name,p.area,p.address,p.note].filter(Boolean).join(" ").toLowerCase().includes(state.q));
  setCount(rows.length,"places free any time");
  if(!rows.length)return empty("Nothing here","No places match.");
  let h=`<div class="lead">Places you can walk into for nothing, no event needed.</div><div class="grid">`;
  for(const p of rows){
    const os=openState(p.opening_hours);
    const badge=os?`<span class="badge ${os.cls}">${os.text}</span>`:"";
    const sub=[p.address,p.note].filter(Boolean).map(esc).join(" · ");
    h+=`<div class="place"><div class="pr"><a class="nm" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>${badge}</div>${sub?`<span class="sub">${sub}</span>`:""}</div>`;
  }
  return h+"</div>";
}
function viewManual(){
  const rows=DATA.manual_check.filter(m=>!state.q||(m.name+" "+(m.group||"")).toLowerCase().includes(state.q));
  setCount(rows.length,"sites to check by hand");
  if(!rows.length)return empty("Nothing to check","No sites match.");
  const byG={};for(const m of rows)(byG[m.group||"Other"]||=[]).push(m);
  let h=`<div class="lead">Places with good programmes that the site can't read automatically yet — open their page to see what's on.</div>`;
  for(const g of Object.keys(byG).sort()){
    h+=`<div class="mgroup">${esc(g)}</div><div class="mlist">`;
    for(const m of byG[g])h+=`<div class="mrow"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a><span class="why">${esc(m.reason||"")}</span></div>`;
    h+="</div>";
  }
  return h;
}

/* the hidden-events line: always says exactly what is hidden, and how many */
function hideBar(){
  const bar=document.getElementById("hidebar");
  if(!POOLS[state.tab]){bar.innerHTML="";return;}
  const n=poolSize(state.tab,true)-poolSize(state.tab,false);
  if(!n){bar.innerHTML="";return;}
  bar.innerHTML=state.showHidden
    ?`Showing everything, including ${n} for kids, specific groups and advice &amp; support. <button id="hidetoggle">Hide them again</button>`
    :`${n} hidden: for kids, older people, specific groups, or advice &amp; support. <button id="hidetoggle">Show them</button>`;
}

const empty=(h,b)=>`<div class="state"><b>${esc(h)}</b>${esc(b)}</div>`;
function setCount(n,kind){document.getElementById("count").textContent=`${n} ${kind}`;}
function render(){
  const v={mine:viewMine,today:viewToday,week:viewWeek,regular:viewRegular,free:viewFree,manual:viewManual}[state.tab];
  document.getElementById("cats").style.display=POOLS[state.tab]?"flex":"none";
  document.getElementById("feed").innerHTML=v();
  hideBar();
}

/* ---------------- opening hours (OSM syntax subset) ---------------- */
function berlinNow(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;const dow=_DOWMAP[g("weekday").slice(0,2).toLowerCase()];let h=+g("hour");if(h===24)h=0;return{dow,mins:h*60+(+g("minute"))};}
function openState(oh){
  if(!oh)return null;
  try{const s=oh.trim();if(/^24\/7$/.test(s))return{cls:"open",text:"Open now"};
    const{dow,mins}=berlinNow();let mentioned=false,iv=[],off=false;
    for(const rule of s.split(";")){const m=rule.trim().match(/^([A-Za-z,\-\s]+?)\s+(.*)$/);if(!m)continue;
      const days=new Set();
      for(const part of m[1].split(",")){const r=part.trim().match(/^([A-Za-z]{2})(?:\s*-\s*([A-Za-z]{2}))?$/);if(!r)continue;
        const a=_DOWMAP[r[1].toLowerCase()];if(a==null)continue;
        if(r[2]!=null){const b=_DOWMAP[r[2].toLowerCase()];for(let d=a;;d=(d+1)%7){days.add(d);if(d===b)break;}}else days.add(a);}
      if(!days.has(dow))continue;mentioned=true;const spec=m[2].trim();
      if(/^off|closed$/i.test(spec)){off=true;continue;}
      for(const tr of spec.split(",")){const t=tr.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);if(!t)continue;iv.push([(+t[1])*60+(+t[2]),(+t[3])*60+(+t[4])]);}}
    if(iv.some(([a,b])=>mins>=a&&mins<b))return{cls:"open",text:"Open now"};
    if(mentioned||off)return{cls:"closed",text:"Closed now"};return null;
  }catch(e){return null;}
}

/* ---------------- calendar export ---------------- */
function icsFor(ev){
  const pad=n=>String(n).padStart(2,"0");
  const f=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
  const st=new Date(ev.start),en=ev.end?new Date(ev.end):new Date(st.getTime()+2*36e5);
  const e2=t=>String(t||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//berlin_today//EN","BEGIN:VEVENT",
    "UID:"+(ev.id||Math.random().toString(36).slice(2))+"@berlin-today","DTSTAMP:"+f(new Date()),
    "DTSTART:"+f(st),"DTEND:"+f(en),"SUMMARY:"+e2(ev.title),ev.summary?"DESCRIPTION:"+e2(ev.summary):"",
    ev.venue?"LOCATION:"+e2(ev.venue):"",ev.url?"URL:"+e2(ev.url):"","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
}
document.addEventListener("click",e=>{
  const gt=e.target.closest("[data-gotab]");
  if(gt){e.preventDefault();const b=document.querySelector(`.tab[data-tab="${gt.dataset.gotab}"]`);if(b)b.click();return;}
  if(e.target.id==="hidetoggle"){state.showHidden=!state.showHidden;state.expanded.clear();
    if(!state.showHidden)for(const k of HIDE_KIND)state.kinds.delete(k);
    buildKindChips();render();tabCounts();return;}
  const exp=e.target.closest("[data-exp]");
  if(exp){const k=exp.dataset.exp;state.expanded.has(k)?state.expanded.delete(k):state.expanded.add(k);render();return;}
  const b=e.target.closest(".cal");if(!b)return;
  const ev=DATA.events.find(x=>String(x.id)===b.dataset.ics);if(!ev)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([icsFor(ev)],{type:"text/calendar;charset=utf-8"}));
  a.download=(ev.title||"event").replace(/[^\w-]+/g,"_").slice(0,48)+".ics";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});

/* ---------------- controls ---------------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;
  state.tab=b.dataset.tab;state.expanded.clear();
  [...b.parentElement.children].forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
  render();
});
function buildKindChips(){
  const box=document.getElementById("cats");box.innerHTML="";
  const present=new Set(DATA.events.map(kindOf));
  for(const [id,label,c] of KINDS){
    if(!present.has(id))continue;
    if(HIDE_KIND.has(id)&&!state.showHidden)continue;
    const b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed",state.kinds.has(id)?"true":"false");
    b.innerHTML=`<span class="dot" style="--c:${c}"></span>${esc(label)}`;
    b.onclick=()=>{const on=b.getAttribute("aria-pressed")==="true";
      on?state.kinds.delete(id):state.kinds.add(id);
      b.setAttribute("aria-pressed",on?"false":"true");render();};
    box.appendChild(b);
  }
}
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});

function tabCounts(){
  const inc=state.showHidden;
  document.getElementById("nMine").textContent=mineCount();
  document.getElementById("nToday").textContent=poolSize("today",inc);
  document.getElementById("nWeek").textContent=poolSize("week",inc);
  document.getElementById("nReg").textContent=poolSize("regular",inc);
  document.getElementById("nFree").textContent=DATA.always_free.length;
  document.getElementById("nManual").textContent=DATA.manual_check.length;
}

fetch("my_list.json?_="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{MY=j;_listItems=null;}).catch(()=>{})
 .then(()=>fetch("data.json?_="+Date.now()))
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{
    DATA={events:d.events||[],always_free:d.always_free||[],manual_check:d.manual_check||[]};
    if(d.generated_at){const ago=Math.round((Date.now()-new Date(d.generated_at))/36e5);
      document.getElementById("updated").textContent="updated "+(ago<1?"just now":ago+"h ago");}
    buildKindChips();tabCounts();render();
  })
  .catch(err=>{
    document.getElementById("feed").innerHTML=`<div class="state"><b>Couldn't load data</b>data.json didn't load (${esc(err.message)}).</div>`;
    document.getElementById("count").textContent="—";
  });
</script>
