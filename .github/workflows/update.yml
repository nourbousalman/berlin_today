name: Update events
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - config.yaml
      - aggregate.py
      - sources/**
      - directory.json      # rebuild immediately when you change the directory
      - manual.ics          # …and when you edit your hand-added events
      - docs/.classify_cache.json   # the daily labelling task pushed new labels -> rebuild
permissions:
  contents: write
concurrency:
  group: update-events      # never run two updates at once (they would fight over the push)
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # start from the latest main, not the (possibly stale) commit that triggered the run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect events
        env:
          # optional: if this secret is ever added, labelling also runs inside each update
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python aggregate.py
      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          # data.json plus every cache file (.classify_cache.json, .gib_cache.json, …).
          # Adding the folder means a cache that does not exist yet can't break the step.
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update events"
            # generated files only: if another run got there first, keep this run's fresh output
            git pull --rebase -X theirs origin main
            git push
          fi
